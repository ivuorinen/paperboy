---
name: Test Build and Run

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Nothing at workflow level: a job without its own permissions block gets no
# token scope at all, so each job below opts into exactly what it needs.
permissions: {}

jobs:
  test-build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step runs git, so the token is not left in .git/config
          # where the build and the feed-fetching smoke run could read it.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Tracks the go and toolchain lines in go.mod so the two cannot drift.
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # The same linter `make lint` runs, so CI and a local run cannot disagree.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: Setup default template and config
        run: cp examples/* .

      # Smoke test only: this fetches live third-party feeds, so it is not a
      # correctness signal. A failing feed is logged and skipped by design; the
      # step fails only when every feed is unreachable, which paperboy reports
      # with a non-zero exit. The go test step above is what gates the build.
      - name: Run program
        run: ./paperboy

  # Separate job so security-events: write is scoped to the scan alone and the
  # build job above keeps contents: read. Costs nothing extra: the govulncheck
  # action bundles its own checkout and setup-go regardless.
  vulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif writes code-scanning alerts
    steps:
      - name: Scan for vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # The action defaults go-version-input to 'stable', and setup-go
          # gives go-version precedence over go-version-file when both are
          # set. Blanking it is what lets go.mod win, matching the build job.
          go-version-input: ""
          go-version-file: go.mod
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

      # govulncheck exits 0 in SARIF mode even when your code calls a
      # vulnerable function, so the scan step reports but does not gate. Verified
      # against golang.org/x/text@v0.3.0: text mode exits 3, SARIF mode exits 0.
      # error-level results are exactly the reachable ones — warning means
      # imported but not called, note means present in the module graph only.
      - name: Fail on reachable vulnerabilities
        run: |
          count=$(jq '[.runs[].results[] | select(.level == "error")] | length' govulncheck.sarif)
          echo "Reachable vulnerabilities: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[]
              | select(.level == "error")
              | "::error::\(.ruleId): \(.message.text | split("\n")[0])"' govulncheck.sarif
            exit 1
          fi
